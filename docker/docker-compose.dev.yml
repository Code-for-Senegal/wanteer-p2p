name: wantere

services:
  postgres:
    # Multi-arch PostGIS build from the maintainer of the official images:
    # postgis/postgis has no arm64 variant.
    image: imresamu/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: wantere
      POSTGRES_PASSWORD: wantere
      POSTGRES_DB: wantere
    ports:
      - '5442:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb/20-trim-extensions.sql:/docker-entrypoint-initdb.d/20-trim-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wantere -d wantere']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6389:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Only needed when working on media uploads.
  minio:
    image: minio/minio:latest
    profiles: ['media']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: wantere
      MINIO_ROOT_PASSWORD: wantere-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
