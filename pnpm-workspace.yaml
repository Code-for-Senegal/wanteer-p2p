packages:
  - apps/*
  - packages/*

# pnpm 11: explicit allowlist for dependency lifecycle scripts.
# Placeholders ("set this to true or false") leave builds unreviewed and
# make `pnpm install` fail under strictDepBuilds (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-image-picker@57.0.19
  - expo-router@57.0.22
  - expo-updates@57.0.23
