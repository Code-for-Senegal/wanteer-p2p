packages:
  - apps/*
  - packages/*

# pnpm 11: explicit allowlist for dependency lifecycle scripts.
# Placeholders ("set this to true or false") leave builds unreviewed and
# make `pnpm install` fail under strictDepBuilds (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
